# Copy to /etc/nginx/sites-available/campudex (done by scripts/deploy.sh, which
# also swaps in the real domain). See docs/DEPLOY.md.

# Upgrade to WebSocket only when the browser asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name campudex.elouann.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx < 1.25.1: remove this line and write `listen 443 ssl http2;`.
    http2 on;
    server_name campudex.elouann.dev;

    ssl_certificate     /etc/letsencrypt/live/campudex.elouann.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campudex.elouann.dev/privkey.pem;

    # Phones never retry over HTTP again.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Quest photos: 10 MB max in the app. Without this, nginx answers 413
    # above 1 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live updates (/_ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Browsers ping every 25 s: a connection silent for longer is dead.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
